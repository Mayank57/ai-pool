<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Pool Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <a class="logo" href="./"><span class="mark"></span>AI Pool</a>
      <div id="invite-banner" class="card hidden" style="margin-top:18px"></div>
      <h1 id="title">Create your workspace</h1>
      <p class="ink2" id="subtitle" style="margin:0 0 6px">Start a 7-day free trial. No card needed.</p>

      <div id="joined-as" class="hidden" style="margin-top:16px"></div>

      <form id="form" class="card" style="margin-top:16px" novalidate>
        <label class="field" data-mode="signup"><span>Your name</span><input type="text" name="name" autocomplete="name" /></label>
        <label class="field"><span>Work email</span><input type="email" name="email" autocomplete="email" required /></label>
        <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required /><div class="hint" data-mode="signup">At least 8 characters.</div></label>
        <label class="field" data-mode="signup" data-hide-invite><span>Workspace name</span><input type="text" name="workspace_name" placeholder="e.g. Acme Engineering" /><div class="hint">Usually your company or team name.</div></label>
        <p id="err" class="notice err hidden" style="margin:14px 0 0"></p>
        <button class="btn primary lg" type="submit" style="width:100%;margin-top:16px" id="submit">Create workspace</button>
      </form>
      <p class="ink2 small" style="text-align:center;margin-top:14px" id="switch"></p>
    </div>
  </div>
  <script type="module" src="auth.js"></script>
</body>
</html>
