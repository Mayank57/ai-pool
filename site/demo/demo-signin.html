<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulated Plan Sign-In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card card">
      <div class="tag">Demo · simulated step</div>
      <h1 id="t" style="font-size:22px;margin:14px 0 6px">Connect a plan</h1>
      <p class="ink2">In the real product, this window is the provider's own sign-in page: you'd log in to Anthropic or OpenAI there, and AI Pool never sees your password. In this demo, just make up an account to add.</p>
      <form id="f">
        <label class="field"><span>Account email (made up)</span><input type="email" id="email" required placeholder="you@example.com" /></label>
        <label class="field"><span>Plan</span><select id="plan"></select></label>
        <button class="btn primary lg" style="width:100%;margin-top:16px" type="submit">Approve access</button>
      </form>
      <p id="done" class="notice ok hidden" style="margin-top:14px">Approved. You can close this tab and go back to AI Pool.</p>
    </div>
  </div>
  <script src="demo-signin.js"></script>
</body>
</html>
